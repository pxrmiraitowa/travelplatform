server:
  port: 8000

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8101}
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/user-contacts/**,/api/admin/dashboard,/api/admin/users/**,/api/admin/roles
        - id: admin-product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8102}
          predicates:
            - Path=/api/admin/flights/**,/api/admin/trains/**,/api/admin/hotels/**,/api/admin/hotel-rooms/**,/api/admin/tours/**,/api/admin/media/**
        - id: admin-order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8103}
          predicates:
            - Path=/api/admin/orders/**
        - id: admin-content-service
          uri: ${CONTENT_TRIP_SERVICE_URL:http://localhost:8104}
          predicates:
            - Path=/api/admin/shares/**,/api/admin/reviews/**
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8102}
          predicates:
            - Path=/api/public/flights/**,/api/public/trains/**,/api/public/hotels/**,/api/public/tours/**,/api/public/price-compare/**
        - id: content-order-review
          uri: ${CONTENT_TRIP_SERVICE_URL:http://localhost:8104}
          predicates:
            - Path=/api/orders/reviewable,/api/orders/*/review
        - id: content-trip-service
          uri: ${CONTENT_TRIP_SERVICE_URL:http://localhost:8104}
          predicates:
            - Path=/api/public/shares/**,/api/public/uploads/**,/api/shares/**,/api/trip-plans/**,/api/price-alerts/**,/api/reviews/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8103}
          predicates:
            - Path=/api/orders/**

service:
  version: 0.0.1-SNAPSHOT

security:
  jwt:
    secret: ${JWT_SECRET:travel-platform-user-service-jwt-secret-2026}
