server:
  port: 8101

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/travel_user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

service:
  version: 0.0.1-SNAPSHOT

security:
  jwt:
    secret: ${JWT_SECRET:travel-platform-user-service-jwt-secret-2026}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
