server:
  port: 8104

spring:
  application:
    name: content-trip-service
  datasource:
    url: jdbc:mysql://localhost:3306/travel_content_trip?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

service:
  version: 0.0.1-SNAPSHOT

services:
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8101}
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8102}
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8103}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

travel:
  upload-dir: ./uploads
