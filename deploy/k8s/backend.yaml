apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: travel-platform
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: travel-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: travel-platform
    spec:
      containers:
        - name: backend
          image: travel-platform-server:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/travel_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travel-platform-secrets
                  key: mysql-root-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: travel-platform-secrets
                  key: jwt-secret
            - name: SQL_INIT_MODE
              value: never
            - name: UPLOAD_DIR
              value: /app/uploads
            - name: AI_PLANNER_ENABLED
              value: "false"
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: travel-platform
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: travel-platform
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http

