apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: travel-platform
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: travel-platform-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: travel-platform-microservices
    spec:
      containers:
        - name: user-service
          image: travel-platform-user-service:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/travel_user?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travel-platform-secrets
                  key: mysql-root-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: travel-platform-secrets
                  key: jwt-secret
            - name: SERVER_PORT
              value: "8101"
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: http
              containerPort: 8101
          startupProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: travel-platform
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: travel-platform-microservices
spec:
  selector:
    app.kubernetes.io/name: user-service
  ports:
    - name: http
      port: 8101
      targetPort: http
