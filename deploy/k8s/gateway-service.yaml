apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: travel-platform
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: travel-platform-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-service
        app.kubernetes.io/part-of: travel-platform-microservices
    spec:
      containers:
        - name: gateway-service
          image: travel-platform-gateway-service:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: travel-platform-secrets
                  key: jwt-secret
            - name: USER_SERVICE_URL
              value: http://user-service:8101
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8102
            - name: ORDER_SERVICE_URL
              value: http://order-service:8103
            - name: CONTENT_TRIP_SERVICE_URL
              value: http://content-trip-service:8104
            - name: SERVER_PORT
              value: "8000"
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: travel-platform
  labels:
    app.kubernetes.io/name: gateway-service
    app.kubernetes.io/part-of: travel-platform-microservices
spec:
  selector:
    app.kubernetes.io/name: gateway-service
  ports:
    - name: http
      port: 8000
      targetPort: http
