apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: travel-platform
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: travel-platform-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: travel-platform-microservices
    spec:
      containers:
        - name: frontend
          image: travel-platform-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: travel-platform
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: travel-platform-microservices
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
