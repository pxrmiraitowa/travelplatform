apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: travel-platform
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: travel-platform-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-service
        app.kubernetes.io/part-of: travel-platform-microservices
    spec:
      containers:
        - name: product-service
          image: travel-platform-product-service:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/travel_product?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: travel-platform-secrets
                  key: mysql-root-password
            - name: SERVER_PORT
              value: "8102"
            - name: UPLOAD_DIR
              value: /app/uploads
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: http
              containerPort: 8102
          volumeMounts:
            - name: product-uploads
              mountPath: /app/uploads
          startupProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 48
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
      volumes:
        - name: product-uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: travel-platform
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: travel-platform-microservices
spec:
  selector:
    app.kubernetes.io/name: product-service
  ports:
    - name: http
      port: 8102
      targetPort: http
