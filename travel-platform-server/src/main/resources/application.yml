server:
  port: 8080

spring:
  application:
    name: travel-platform-server
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
  datasource:
    url: jdbc:mysql://localhost:3306/travel_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    #改成你自己的数据库用户名和密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql,classpath:sql/ai_trip_plan.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.travelplatform: info

security:
  jwt:
    secret: travelplatform-demo-secret-key-for-jwt-signing-2026
    expiration-seconds: 86400

travel:
  upload-dir: ./uploads

ai:
  planner:
    enabled: ${AI_PLANNER_ENABLED:true}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4.1-mini}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
    candidate-limit: ${AI_CANDIDATE_LIMIT:18}
    max-attractions-per-day: ${AI_MAX_ATTRACTIONS_PER_DAY:3}
