server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: travel-platform-server
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/travel_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: "${DB_USERNAME:root}"
    # 仅用于本地演示；CI 和 Kubernetes 必须通过环境变量覆盖。
    password: "${DB_PASSWORD:123456}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: "${SQL_INIT_MODE:always}"
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data-demo.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.travelplatform: ${APP_LOG_LEVEL:info}

security:
  jwt:
    # 仅用于本地演示；CI 和 Kubernetes 必须通过 Secret 覆盖。
    secret: "${JWT_SECRET:travel-platform-local-demo-secret-change-before-deploy-2026}"
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

travel:
  upload-dir: "${UPLOAD_DIR:./uploads}"

ai:
  planner:
    enabled: ${AI_PLANNER_ENABLED:true}
    base-url: "${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}"
    api-key: "${AI_API_KEY:}"
    model: "${AI_MODEL:qwen-plus}"
    chat-completions-path: "${AI_CHAT_COMPLETIONS_PATH:/chat/completions}"
    use-json-schema-response-format: ${AI_USE_JSON_SCHEMA_RESPONSE_FORMAT:false}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
    candidate-limit: ${AI_CANDIDATE_LIMIT:18}
    max-attractions-per-day: ${AI_MAX_ATTRACTIONS_PER_DAY:3}
