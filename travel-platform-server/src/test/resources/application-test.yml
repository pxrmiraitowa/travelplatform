spring:
  datasource:
    url: jdbc:mysql://localhost:3306/travel_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

security:
  jwt:
    secret: travelplatform-demo-secret-key-for-jwt-signing-2026
    expiration-seconds: 86400

travel:
  upload-dir: ./target/test-uploads

logging:
  level:
    com.travelplatform: warn
