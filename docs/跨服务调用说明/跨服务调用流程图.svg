<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060">
  <defs>
    <style>
      .title { font: 700 34px "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px "Microsoft YaHei", Arial, sans-serif; fill: #4b5563; }
      .lane-title { font: 700 22px "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .step-title { font: 700 16px "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .step-text { font: 400 14px "Microsoft YaHei", Arial, sans-serif; fill: #374151; }
      .note { font: 400 15px "Microsoft YaHei", Arial, sans-serif; fill: #374151; }
      .small { font: 400 13px "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .user { fill: #eff6ff; stroke: #2563eb; }
      .product { fill: #ecfdf5; stroke: #059669; }
      .order { fill: #fef2f2; stroke: #dc2626; }
      .content { fill: #f5f3ff; stroke: #7c3aed; }
      .step { fill: #ffffff; stroke-width: 1.6; rx: 9; }
      .line { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .fail { stroke: #f59e0b; stroke-width: 2.4; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow-orange); }
      .tag { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.4; rx: 8; }
      .tag-text { font: 600 14px "Microsoft YaHei", Arial, sans-serif; fill: #92400e; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="1500" height="1060" fill="#f8fafc"/>
  <text x="750" y="56" text-anchor="middle" class="title">微服务跨服务调用流程图</text>
  <text x="750" y="88" text-anchor="middle" class="subtitle">重点展示下单、取消、评价、行程生成和价格提醒的服务协作与失败处理</text>

  <rect x="70" y="130" width="315" height="820" class="lane"/>
  <text x="228" y="168" text-anchor="middle" class="lane-title">前端 / 用户操作</text>

  <rect x="425" y="130" width="315" height="820" class="lane"/>
  <text x="583" y="168" text-anchor="middle" class="lane-title">order-service</text>

  <rect x="780" y="130" width="315" height="820" class="lane"/>
  <text x="938" y="168" text-anchor="middle" class="lane-title">product-service</text>

  <rect x="1135" y="130" width="315" height="820" class="lane"/>
  <text x="1293" y="168" text-anchor="middle" class="lane-title">content-trip-service</text>

  <rect x="105" y="215" width="245" height="74" class="step user"/>
  <text x="228" y="242" text-anchor="middle" class="step-title">创建订单</text>
  <text x="228" y="266" text-anchor="middle" class="step-text">机票 / 火车票 / 酒店 / 旅游产品</text>

  <rect x="460" y="215" width="245" height="74" class="step order"/>
  <text x="583" y="242" text-anchor="middle" class="step-title">接收下单请求</text>
  <text x="583" y="266" text-anchor="middle" class="step-text">校验登录态和请求参数</text>

  <rect x="815" y="205" width="245" height="52" class="step product"/>
  <text x="938" y="237" text-anchor="middle" class="step-title">查询商品快照</text>
  <rect x="815" y="278" width="245" height="52" class="step product"/>
  <text x="938" y="310" text-anchor="middle" class="step-title">扣减库存</text>

  <rect x="460" y="330" width="245" height="74" class="step order"/>
  <text x="583" y="357" text-anchor="middle" class="step-title">写入订单</text>
  <text x="583" y="381" text-anchor="middle" class="step-text">orders + 对应明细表</text>

  <path d="M350 252 L460 252" class="line"/>
  <path d="M705 240 L815 230" class="line"/>
  <path d="M705 270 L815 302" class="line"/>
  <path d="M815 330 C760 350 730 365 705 367" class="line"/>
  <path d="M460 385 C390 400 355 335 350 280" class="line"/>

  <rect x="808" y="363" width="263" height="58" class="tag"/>
  <text x="940" y="387" text-anchor="middle" class="tag-text">失败处理</text>
  <text x="940" y="409" text-anchor="middle" class="small">库存已扣但订单失败时恢复库存</text>
  <path d="M705 380 C775 430 805 410 815 330" class="fail"/>

  <rect x="105" y="475" width="245" height="74" class="step user"/>
  <text x="228" y="502" text-anchor="middle" class="step-title">取消订单</text>
  <text x="228" y="526" text-anchor="middle" class="step-text">用户或管理员触发</text>

  <rect x="460" y="475" width="245" height="74" class="step order"/>
  <text x="583" y="502" text-anchor="middle" class="step-title">校验并改状态</text>
  <text x="583" y="526" text-anchor="middle" class="step-text">归属、状态、业务类型</text>

  <rect x="815" y="475" width="245" height="74" class="step product"/>
  <text x="938" y="502" text-anchor="middle" class="step-title">恢复库存</text>
  <text x="938" y="526" text-anchor="middle" class="step-text">按业务类型恢复数量</text>

  <path d="M350 512 L460 512" class="line"/>
  <path d="M705 512 L815 512" class="line"/>
  <path d="M815 540 C720 600 440 595 350 540" class="line"/>

  <rect x="105" y="655" width="245" height="74" class="step user"/>
  <text x="228" y="682" text-anchor="middle" class="step-title">提交评价</text>
  <text x="228" y="706" text-anchor="middle" class="step-text">已完成订单才能评价</text>

  <rect x="1170" y="655" width="245" height="74" class="step content"/>
  <text x="1293" y="682" text-anchor="middle" class="step-title">保存评价</text>
  <text x="1293" y="706" text-anchor="middle" class="step-text">review 表写入评分和内容</text>

  <rect x="460" y="655" width="245" height="74" class="step order"/>
  <text x="583" y="682" text-anchor="middle" class="step-title">订单可评价校验</text>
  <text x="583" y="706" text-anchor="middle" class="step-text">是否本人、已完成、未评价</text>

  <path d="M350 692 C640 615 950 620 1170 692" class="line"/>
  <path d="M1170 710 C950 780 700 770 705 705" class="line"/>
  <path d="M460 692 C385 705 365 705 350 700" class="line"/>

  <rect x="785" y="756" width="305" height="58" class="tag"/>
  <text x="938" y="780" text-anchor="middle" class="tag-text">失败处理</text>
  <text x="938" y="802" text-anchor="middle" class="small">订单服务不可用或状态不符时拒绝评价</text>

  <rect x="105" y="845" width="245" height="74" class="step user"/>
  <text x="228" y="872" text-anchor="middle" class="step-title">行程 / 价格提醒</text>
  <text x="228" y="896" text-anchor="middle" class="step-text">生成行程或查看提醒</text>

  <rect x="1170" y="845" width="245" height="74" class="step content"/>
  <text x="1293" y="872" text-anchor="middle" class="step-title">内容行程处理</text>
  <text x="1293" y="896" text-anchor="middle" class="step-text">生成预览、保存或展示提醒</text>

  <rect x="815" y="845" width="245" height="74" class="step product"/>
  <text x="938" y="872" text-anchor="middle" class="step-title">查询商品数据</text>
  <text x="938" y="896" text-anchor="middle" class="step-text">景点候选 / 当前价格</text>

  <path d="M350 882 C640 820 945 820 1170 882" class="line"/>
  <path d="M1170 890 L1060 890" class="line"/>
  <path d="M815 905 C640 980 415 960 350 900" class="line"/>

  <rect x="442" y="965" width="616" height="58" class="tag"/>
  <text x="750" y="989" text-anchor="middle" class="tag-text">降级策略</text>
  <text x="750" y="1011" text-anchor="middle" class="small">景点接口失败时使用本地规则或固定演示数据；价格查询失败时显示当前价格暂不可用</text>
</svg>
