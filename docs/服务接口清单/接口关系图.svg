<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .title { font: 700 34px "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px "Microsoft YaHei", Arial, sans-serif; fill: #4b5563; }
      .service-title { font: 700 22px "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .service-subtitle { font: 400 14px "Microsoft YaHei", Arial, sans-serif; fill: #4b5563; }
      .endpoint { font: 400 15px Consolas, "Microsoft YaHei", monospace; fill: #1f2937; }
      .small { font: 400 14px "Microsoft YaHei", Arial, sans-serif; fill: #374151; }
      .box { fill: #ffffff; stroke-width: 2; rx: 10; }
      .gateway { stroke: #475569; fill: #f8fafc; }
      .user { stroke: #2563eb; fill: #eff6ff; }
      .product { stroke: #059669; fill: #ecfdf5; }
      .order { stroke: #dc2626; fill: #fef2f2; }
      .content { stroke: #7c3aed; fill: #f5f3ff; }
      .pill { fill: #ffffff; stroke-width: 1.3; rx: 7; }
      .line { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .internal { stroke: #f59e0b; stroke-width: 2.5; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow-orange); }
      .label-bg { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; rx: 5; }
      .label { font: 500 14px "Microsoft YaHei", Arial, sans-serif; fill: #334155; }
      .internal-label { font: 600 14px "Microsoft YaHei", Arial, sans-serif; fill: #92400e; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="1500" height="980" fill="#f8fafc"/>
  <text x="750" y="56" text-anchor="middle" class="title">微服务接口关系图</text>
  <text x="750" y="88" text-anchor="middle" class="subtitle">前端通过统一入口访问外部接口，服务间通过 internal 接口完成跨领域协作</text>

  <rect x="555" y="125" width="390" height="95" class="box gateway"/>
  <text x="750" y="165" text-anchor="middle" class="service-title">统一入口</text>
  <text x="750" y="194" text-anchor="middle" class="service-subtitle">Nginx / Gateway / Vite Proxy</text>

  <rect x="70" y="300" width="310" height="310" class="box user"/>
  <text x="100" y="342" class="service-title">user-service</text>
  <text x="100" y="367" class="service-subtitle">用户与认证服务 8101</text>
  <rect x="100" y="395" width="245" height="34" class="pill" stroke="#2563eb"/>
  <text x="115" y="417" class="endpoint">POST /api/auth/login</text>
  <rect x="100" y="438" width="245" height="34" class="pill" stroke="#2563eb"/>
  <text x="115" y="460" class="endpoint">POST /api/auth/register</text>
  <rect x="100" y="481" width="245" height="34" class="pill" stroke="#2563eb"/>
  <text x="115" y="503" class="endpoint">GET /api/users/me</text>
  <rect x="100" y="524" width="245" height="34" class="pill" stroke="#2563eb"/>
  <text x="115" y="546" class="endpoint">/api/user-contacts/**</text>
  <rect x="100" y="567" width="245" height="34" class="pill" stroke="#2563eb"/>
  <text x="115" y="589" class="endpoint">/api/admin/users/**</text>

  <rect x="430" y="300" width="310" height="365" class="box product"/>
  <text x="460" y="342" class="service-title">product-service</text>
  <text x="460" y="367" class="service-subtitle">产品与库存服务 8102</text>
  <rect x="460" y="395" width="245" height="34" class="pill" stroke="#059669"/>
  <text x="475" y="417" class="endpoint">/api/public/flights/**</text>
  <rect x="460" y="438" width="245" height="34" class="pill" stroke="#059669"/>
  <text x="475" y="460" class="endpoint">/api/public/trains/**</text>
  <rect x="460" y="481" width="245" height="34" class="pill" stroke="#059669"/>
  <text x="475" y="503" class="endpoint">/api/public/hotels/**</text>
  <rect x="460" y="524" width="245" height="34" class="pill" stroke="#059669"/>
  <text x="475" y="546" class="endpoint">/api/public/tours/**</text>
  <rect x="460" y="567" width="245" height="34" class="pill" stroke="#059669"/>
  <text x="475" y="589" class="endpoint">/api/public/price-compare/**</text>
  <rect x="460" y="610" width="245" height="34" class="pill" stroke="#059669"/>
  <text x="475" y="632" class="endpoint">/api/admin/products/**</text>

  <rect x="790" y="300" width="310" height="310" class="box order"/>
  <text x="820" y="342" class="service-title">order-service</text>
  <text x="820" y="367" class="service-subtitle">订单交易服务 8103</text>
  <rect x="820" y="395" width="245" height="34" class="pill" stroke="#dc2626"/>
  <text x="835" y="417" class="endpoint">POST /api/orders/flights</text>
  <rect x="820" y="438" width="245" height="34" class="pill" stroke="#dc2626"/>
  <text x="835" y="460" class="endpoint">POST /api/orders/hotels</text>
  <rect x="820" y="481" width="245" height="34" class="pill" stroke="#dc2626"/>
  <text x="835" y="503" class="endpoint">GET /api/orders</text>
  <rect x="820" y="524" width="245" height="34" class="pill" stroke="#dc2626"/>
  <text x="835" y="546" class="endpoint">POST /api/orders/{id}/cancel</text>
  <rect x="820" y="567" width="245" height="34" class="pill" stroke="#dc2626"/>
  <text x="835" y="589" class="endpoint">/api/admin/orders/**</text>

  <rect x="1150" y="300" width="310" height="365" class="box content"/>
  <text x="1180" y="342" class="service-title">content-trip-service</text>
  <text x="1180" y="367" class="service-subtitle">内容与行程服务 8104</text>
  <rect x="1180" y="395" width="245" height="34" class="pill" stroke="#7c3aed"/>
  <text x="1195" y="417" class="endpoint">/api/trip-plans/**</text>
  <rect x="1180" y="438" width="245" height="34" class="pill" stroke="#7c3aed"/>
  <text x="1195" y="460" class="endpoint">/api/shares/**</text>
  <rect x="1180" y="481" width="245" height="34" class="pill" stroke="#7c3aed"/>
  <text x="1195" y="503" class="endpoint">/api/public/shares/**</text>
  <rect x="1180" y="524" width="245" height="34" class="pill" stroke="#7c3aed"/>
  <text x="1195" y="546" class="endpoint">/api/reviews/**</text>
  <rect x="1180" y="567" width="245" height="34" class="pill" stroke="#7c3aed"/>
  <text x="1195" y="589" class="endpoint">/api/price-alerts/**</text>
  <rect x="1180" y="610" width="245" height="34" class="pill" stroke="#7c3aed"/>
  <text x="1195" y="632" class="endpoint">/api/admin/content/**</text>

  <path d="M640 220 C500 245 345 265 230 300" class="line"/>
  <path d="M715 220 C670 250 625 270 585 300" class="line"/>
  <path d="M785 220 C835 250 895 270 945 300" class="line"/>
  <path d="M860 220 C1020 245 1190 265 1305 300" class="line"/>

  <rect x="965" y="712" width="305" height="70" class="label-bg"/>
  <text x="1118" y="740" text-anchor="middle" class="internal-label">商品快照 / 扣库存 / 恢复库存</text>
  <text x="1118" y="765" text-anchor="middle" class="small">order-service -> product-service</text>
  <path d="M885 610 C830 710 715 735 705 640" class="internal"/>

  <rect x="1040" y="805" width="305" height="70" class="label-bg"/>
  <text x="1193" y="833" text-anchor="middle" class="internal-label">评价前订单状态校验</text>
  <text x="1193" y="858" text-anchor="middle" class="small">content-trip-service -> order-service</text>
  <path d="M1190 665 C1120 745 1050 740 1020 610" class="internal"/>

  <rect x="540" y="805" width="350" height="70" class="label-bg"/>
  <text x="715" y="833" text-anchor="middle" class="internal-label">景点候选 / 商品当前价格</text>
  <text x="715" y="858" text-anchor="middle" class="small">content-trip-service -> product-service</text>
  <path d="M1180 665 C980 815 720 795 660 665" class="internal"/>

  <rect x="70" y="905" width="1360" height="45" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="934" class="small">说明：实线表示前端外部接口路由；虚线表示服务间 internal 接口调用。所有接口统一使用 Result 返回格式。</text>
</svg>
