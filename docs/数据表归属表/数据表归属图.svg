<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <style>
      .title { font: 700 34px "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 400 18px "Microsoft YaHei", Arial, sans-serif; fill: #4b5563; }
      .service-title { font: 700 24px "Microsoft YaHei", Arial, sans-serif; fill: #111827; }
      .service-desc { font: 400 15px "Microsoft YaHei", Arial, sans-serif; fill: #374151; }
      .db-title { font: 700 18px "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .table-text { font: 400 16px Consolas, "Microsoft YaHei", monospace; fill: #1f2937; }
      .note { font: 400 16px "Microsoft YaHei", Arial, sans-serif; fill: #374151; }
      .box { fill: #ffffff; stroke-width: 2; rx: 10; }
      .user { stroke: #2563eb; }
      .product { stroke: #059669; }
      .order { stroke: #dc2626; }
      .content { stroke: #7c3aed; }
      .user-bg { fill: #eff6ff; }
      .product-bg { fill: #ecfdf5; }
      .order-bg { fill: #fef2f2; }
      .content-bg { fill: #f5f3ff; }
      .pill { stroke-width: 1.5; rx: 8; }
      .line { stroke: #9ca3af; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="920" fill="#f8fafc"/>
  <text x="700" y="58" text-anchor="middle" class="title">微服务数据表归属图</text>
  <text x="700" y="90" text-anchor="middle" class="subtitle">每张业务表只能由一个服务直接管理，其他服务通过接口访问，不跨库联表查询</text>

  <rect x="70" y="135" width="590" height="300" class="box user user-bg"/>
  <text x="105" y="180" class="service-title">user-service</text>
  <text x="105" y="208" class="service-desc">用户、角色、联系人、认证与管理员身份</text>
  <text x="105" y="248" class="db-title">数据库：travel_user</text>
  <rect x="105" y="270" width="220" height="42" class="pill user" fill="#ffffff"/>
  <text x="125" y="297" class="table-text">user</text>
  <rect x="350" y="270" width="220" height="42" class="pill user" fill="#ffffff"/>
  <text x="370" y="297" class="table-text">role</text>
  <rect x="105" y="330" width="220" height="42" class="pill user" fill="#ffffff"/>
  <text x="125" y="357" class="table-text">user_role</text>
  <rect x="350" y="330" width="220" height="42" class="pill user" fill="#ffffff"/>
  <text x="370" y="357" class="table-text">user_contact</text>

  <rect x="740" y="135" width="590" height="300" class="box product product-bg"/>
  <text x="775" y="180" class="service-title">product-service</text>
  <text x="775" y="208" class="service-desc">商品资源、价格、库存、优惠券与景点基础数据</text>
  <text x="775" y="248" class="db-title">数据库：travel_product</text>
  <rect x="775" y="270" width="170" height="42" class="pill product" fill="#ffffff"/>
  <text x="795" y="297" class="table-text">flight</text>
  <rect x="965" y="270" width="170" height="42" class="pill product" fill="#ffffff"/>
  <text x="985" y="297" class="table-text">train_ticket</text>
  <rect x="1155" y="270" width="140" height="42" class="pill product" fill="#ffffff"/>
  <text x="1175" y="297" class="table-text">hotel</text>
  <rect x="775" y="330" width="170" height="42" class="pill product" fill="#ffffff"/>
  <text x="795" y="357" class="table-text">hotel_room</text>
  <rect x="965" y="330" width="170" height="42" class="pill product" fill="#ffffff"/>
  <text x="985" y="357" class="table-text">tour_package</text>
  <rect x="1155" y="330" width="140" height="42" class="pill product" fill="#ffffff"/>
  <text x="1175" y="357" class="table-text">coupon</text>
  <rect x="775" y="390" width="170" height="42" class="pill product" fill="#ffffff"/>
  <text x="795" y="417" class="table-text">attraction</text>

  <rect x="70" y="500" width="590" height="275" class="box order order-bg"/>
  <text x="105" y="545" class="service-title">order-service</text>
  <text x="105" y="573" class="service-desc">统一订单、订单明细、订单状态流转与取消订单</text>
  <text x="105" y="613" class="db-title">数据库：travel_order</text>
  <rect x="105" y="635" width="170" height="42" class="pill order" fill="#ffffff"/>
  <text x="125" y="662" class="table-text">orders</text>
  <rect x="295" y="635" width="170" height="42" class="pill order" fill="#ffffff"/>
  <text x="315" y="662" class="table-text">order_flight</text>
  <rect x="485" y="635" width="140" height="42" class="pill order" fill="#ffffff"/>
  <text x="505" y="662" class="table-text">order_train</text>
  <rect x="105" y="695" width="170" height="42" class="pill order" fill="#ffffff"/>
  <text x="125" y="722" class="table-text">order_hotel</text>
  <rect x="295" y="695" width="170" height="42" class="pill order" fill="#ffffff"/>
  <text x="315" y="722" class="table-text">order_tour</text>

  <rect x="740" y="500" width="590" height="275" class="box content content-bg"/>
  <text x="775" y="545" class="service-title">content-trip-service</text>
  <text x="775" y="573" class="service-desc">行程、分享、评价、价格提醒与用户内容</text>
  <text x="775" y="613" class="db-title">数据库：travel_content_trip</text>
  <rect x="775" y="635" width="170" height="42" class="pill content" fill="#ffffff"/>
  <text x="795" y="662" class="table-text">trip_plan</text>
  <rect x="965" y="635" width="170" height="42" class="pill content" fill="#ffffff"/>
  <text x="985" y="662" class="table-text">trip_plan_item</text>
  <rect x="1155" y="635" width="140" height="42" class="pill content" fill="#ffffff"/>
  <text x="1175" y="662" class="table-text">review</text>
  <rect x="775" y="695" width="170" height="42" class="pill content" fill="#ffffff"/>
  <text x="795" y="722" class="table-text">share_post</text>
  <rect x="965" y="695" width="170" height="42" class="pill content" fill="#ffffff"/>
  <text x="985" y="722" class="table-text">share_image</text>
  <rect x="1155" y="695" width="140" height="42" class="pill content" fill="#ffffff"/>
  <text x="1175" y="722" class="table-text">price_alert</text>

  <path d="M405 500 C455 455, 560 435, 740 390" class="line"/>
  <text x="505" y="458" class="note">订单保存商品业务 ID 和快照</text>
  <path d="M875 500 C810 460, 710 455, 620 635" class="line"/>
  <text x="665" y="488" class="note">评价通过接口校验订单状态</text>

  <rect x="70" y="830" width="1260" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="864" class="note">设计约束：服务只连接自己的数据库；不建立跨库外键；跨服务引用保存业务 ID；其他服务通过内部接口读取快照或校验结果。</text>
</svg>
