name: CI/CD - GitHub Actions, GHCR and Kind

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-platform-kind-${{ github.ref }}
  cancel-in-progress: false

env:
  CI_DB_PASSWORD: travel-platform-ci-db-password
  CI_JWT_SECRET: travel-platform-ci-jwt-secret-for-kind-deployment-2026
  KIND_CLUSTER_NAME: travel-platform-ci
  MYSQL_SOURCE_IMAGE: mysql:8.4@sha256:1d6b6a8fcee8ff758ff151d017f5203cd06792a0e698f0a593c9dfcb14609cf0
  MYSQL_KIND_IMAGE: mysql:8.4-kind-amd64

jobs:
  build:
    name: 1. Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: travel-platform-server/pom.xml

      - name: Set up Node.js 22 and npm cache
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: travel-platform-web/package-lock.json

      - name: Install backend dependencies
        working-directory: travel-platform-server
        run: mvn -B dependency:go-offline | tee ../artifacts/backend-dependencies.log

      - name: Install frontend dependencies
        working-directory: travel-platform-web
        run: npm ci | tee ../artifacts/frontend-dependencies.log

      - name: Compile and package backend
        working-directory: travel-platform-server
        run: mvn -B -DskipTests clean package | tee ../artifacts/backend-build.log

      - name: Compile frontend
        working-directory: travel-platform-web
        run: npm run build | tee ../artifacts/frontend-build.log

      - name: Retain compiled artifacts and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-output-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/**
            travel-platform-server/target/*.jar
            travel-platform-web/dist/**

  backend_unit_test:
    name: 2. Backend unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: travel-platform-server/pom.xml

      - name: Install backend dependencies
        working-directory: travel-platform-server
        run: mvn -B dependency:go-offline | tee ../artifacts/backend-dependencies.log

      - name: Run backend unit tests
        working-directory: travel-platform-server
        run: mvn -B "-Dtest=!*IntegrationTest" test | tee ../artifacts/backend-unit-tests.log

      - name: Retain backend unit-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-unit-test-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/**
            travel-platform-server/target/surefire-reports/**
            travel-platform-server/target/site/jacoco/**

  frontend_unit_test:
    name: 3. Frontend unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Set up Node.js 22 and npm cache
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: travel-platform-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: travel-platform-web
        run: npm ci | tee ../artifacts/frontend-dependencies.log

      - name: Run frontend unit tests
        working-directory: travel-platform-web
        run: npm run test:unit | tee ../artifacts/frontend-unit-tests.log

      - name: Retain frontend unit-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-unit-test-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: artifacts/**

  integration_test:
    name: 4. Integration tests
    needs:
      - backend_unit_test
      - frontend_unit_test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: travel_platform_it
          MYSQL_ROOT_PASSWORD: travel-platform-ci-db-password
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptravel-platform-ci-db-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: travel-platform-server/pom.xml

      - name: Install backend dependencies
        working-directory: travel-platform-server
        run: mvn -B dependency:go-offline | tee ../artifacts/backend-dependencies.log

      - name: Run backend integration tests
        working-directory: travel-platform-server
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/travel_platform_it?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ${{ env.CI_DB_PASSWORD }}
        run: mvn -B "-Dtest=*IntegrationTest" test | tee ../artifacts/backend-integration-tests.log

      - name: Retain integration-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/**
            travel-platform-server/target/surefire-reports/**
            travel-platform-server/target/site/jacoco/**

  build_images:
    name: 5. Build and push images
    needs: integration_test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.image_metadata.outputs.backend_image }}
      frontend_image: ${{ steps.image_metadata.outputs.frontend_image }}
      image_tag: ${{ steps.image_metadata.outputs.image_tag }}
      release_tag: ${{ steps.image_metadata.outputs.release_tag }}
      backend_digest: ${{ steps.build_backend.outputs.digest }}
      frontend_digest: ${{ steps.build_frontend.outputs.digest }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Prepare versioned image names
        id: image_metadata
        shell: bash
        run: |
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::12}"
          backend_image="ghcr.io/${owner_lower}/travel-platform-server"
          frontend_image="ghcr.io/${owner_lower}/travel-platform-web"
          image_tag="sha-${short_sha}"
          release_tag="0.1.${GITHUB_RUN_NUMBER}"

          {
            echo "backend_image=${backend_image}"
            echo "frontend_image=${frontend_image}"
            echo "image_tag=${image_tag}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "BACKEND_IMAGE=${backend_image}"
            echo "FRONTEND_IMAGE=${frontend_image}"
            echo "IMAGE_TAG=${image_tag}"
            echo "RELEASE_TAG=${release_tag}"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push versioned backend image
        id: build_backend
        uses: docker/build-push-action@v7
        with:
          context: ./travel-platform-server
          push: true
          provenance: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push versioned frontend image
        id: build_frontend
        uses: docker/build-push-action@v7
        with:
          context: ./travel-platform-web
          push: true
          provenance: false
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Record pushed image versions
        shell: bash
        run: |
          {
            echo "backend_image=${BACKEND_IMAGE}:${IMAGE_TAG}"
            echo "backend_release=${BACKEND_IMAGE}:${RELEASE_TAG}"
            echo "backend_digest=${{ steps.build_backend.outputs.digest }}"
            echo "frontend_image=${FRONTEND_IMAGE}:${IMAGE_TAG}"
            echo "frontend_release=${FRONTEND_IMAGE}:${RELEASE_TAG}"
            echo "frontend_digest=${{ steps.build_frontend.outputs.digest }}"
          } | tee artifacts/image-versions.log

      - name: Save image-build result
        if: always()
        shell: bash
        run: |
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "result=${{ job.status }}"
          } > artifacts/run-summary.txt

      - name: Retain image-build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-build-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: artifacts/**

  deploy_and_health_check:
    name: 6. Deploy and health check
    needs: build_images
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    env:
      BACKEND_IMAGE: ${{ needs.build_images.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.build_images.outputs.frontend_image }}
      IMAGE_TAG: ${{ needs.build_images.outputs.image_tag }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Log in to GHCR for deployment
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Kind v0.32.0
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x kind
          sudo install kind /usr/local/bin/kind
          kind version | tee artifacts/kind-version.log
          kubectl version --client | tee artifacts/kubectl-version.log

      - name: Create Kind cluster
        run: >-
          kind create cluster
          --name "${KIND_CLUSTER_NAME}"
          --config deploy/kind/cluster.yaml
          --wait 180s

      - name: Pull and load deployment images into Kind
        shell: bash
        run: |
          docker pull "${MYSQL_SOURCE_IMAGE}"
          docker tag "${MYSQL_SOURCE_IMAGE}" "${MYSQL_KIND_IMAGE}"
          docker pull "${BACKEND_IMAGE}:${IMAGE_TAG}" | tee artifacts/backend-image-pull.log
          docker pull "${FRONTEND_IMAGE}:${IMAGE_TAG}" | tee artifacts/frontend-image-pull.log

          kind load docker-image "${MYSQL_KIND_IMAGE}" --name "${KIND_CLUSTER_NAME}"
          kind load docker-image "${BACKEND_IMAGE}:${IMAGE_TAG}" --name "${KIND_CLUSTER_NAME}"
          kind load docker-image "${FRONTEND_IMAGE}:${IMAGE_TAG}" --name "${KIND_CLUSTER_NAME}"

      - name: Deploy to Kubernetes
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.CI_DB_PASSWORD }}
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
        run: bash scripts/deploy-kind.sh | tee artifacts/kubernetes-deploy.log

      - name: Run Kubernetes health checks
        run: bash scripts/health-check.sh | tee artifacts/kubernetes-health-check.log

      - name: Collect Docker and Kubernetes diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-containers.txt 2>&1 || true
          bash scripts/collect-k8s-logs.sh artifacts/k8s || true

      - name: Save deployment result
        if: always()
        shell: bash
        run: |
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "result=${{ job.status }}"
            echo "backend_image=${BACKEND_IMAGE}:${IMAGE_TAG}"
            echo "frontend_image=${FRONTEND_IMAGE}:${IMAGE_TAG}"
            echo "backend_digest=${{ needs.build_images.outputs.backend_digest }}"
            echo "frontend_digest=${{ needs.build_images.outputs.frontend_digest }}"
          } > artifacts/run-summary.txt

      - name: Retain deployment and health-check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: artifacts/**
