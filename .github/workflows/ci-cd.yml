name: Microservices CI

on:
  push:
    branches:
      - dev
      - "codex/**"
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: travel-platform-microservices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: travel-platform-microservices/pom.xml

      - name: Set up Node.js 22 and npm cache
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: travel-platform-web/package-lock.json

      - name: Run microservice tests
        working-directory: travel-platform-microservices
        run: mvn -B -pl user-service,product-service,order-service,content-trip-service,gateway-service -am test

      - name: Install frontend dependencies
        working-directory: travel-platform-web
        run: npm ci

      - name: Run frontend unit tests
        working-directory: travel-platform-web
        run: npm run test:unit

      - name: Build frontend
        working-directory: travel-platform-web
        run: npm run build

  docker_build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build_and_test
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - product-service
          - order-service
          - content-trip-service
          - gateway-service

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ./travel-platform-microservices
          file: ./travel-platform-microservices/Dockerfile
          push: false
          provenance: false
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          tags: travel-platform-${{ matrix.service }}:${{ github.sha }}

      - name: Build frontend image
        if: matrix.service == 'gateway-service'
        uses: docker/build-push-action@v7
        with:
          context: ./travel-platform-web
          file: ./travel-platform-web/Dockerfile
          push: false
          provenance: false
          tags: travel-platform-web:${{ github.sha }}
