name: CI/CD - GitHub Actions, GHCR and Kind

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: travel-platform-kind-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-package-deploy:
    name: Build, test, package and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: travel_platform_it
          MYSQL_ROOT_PASSWORD: travel-platform-ci-db-password
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptravel-platform-ci-db-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s

    env:
      CI_DB_PASSWORD: travel-platform-ci-db-password
      CI_JWT_SECRET: travel-platform-ci-jwt-secret-for-kind-deployment-2026
      KIND_CLUSTER_NAME: travel-platform-ci
      MYSQL_SOURCE_IMAGE: mysql:8.4@sha256:1d6b6a8fcee8ff758ff151d017f5203cd06792a0e698f0a593c9dfcb14609cf0
      MYSQL_KIND_IMAGE: mysql:8.4-kind-amd64

    steps:
      - name: 1. Check out source code
        uses: actions/checkout@v7

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: travel-platform-server/pom.xml

      - name: Set up Node.js 22 and npm cache
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: travel-platform-web/package-lock.json

      - name: 2. Install backend dependencies
        working-directory: travel-platform-server
        run: mvn -B dependency:go-offline | tee ../artifacts/backend-dependencies.log

      - name: 2. Install frontend dependencies
        working-directory: travel-platform-web
        run: npm ci | tee ../artifacts/frontend-dependencies.log

      - name: 3. Compile backend
        working-directory: travel-platform-server
        run: mvn -B -DskipTests clean compile | tee ../artifacts/backend-compile.log

      - name: 3. Compile frontend
        working-directory: travel-platform-web
        run: npm run build | tee ../artifacts/frontend-build.log

      - name: 4. Run backend unit tests
        working-directory: travel-platform-server
        run: mvn -B "-Dtest=!*IntegrationTest" test | tee ../artifacts/backend-unit-tests.log

      - name: 4. Run frontend unit tests
        working-directory: travel-platform-web
        run: npm run test:unit | tee ../artifacts/frontend-unit-tests.log

      - name: 5. Run backend integration tests
        working-directory: travel-platform-server
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/travel_platform_it?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ${{ env.CI_DB_PASSWORD }}
        run: mvn -B "-Dtest=*IntegrationTest" test | tee ../artifacts/backend-integration-tests.log

      - name: Prepare versioned image names
        shell: bash
        run: |
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::12}"
          {
            echo "BACKEND_IMAGE=ghcr.io/${owner_lower}/travel-platform-server"
            echo "FRONTEND_IMAGE=ghcr.io/${owner_lower}/travel-platform-web"
            echo "IMAGE_TAG=sha-${short_sha}"
            echo "RELEASE_TAG=0.1.${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 6. Build versioned backend image
        uses: docker/build-push-action@v7
        with:
          context: ./travel-platform-server
          load: true
          push: false
          provenance: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 6. Build versioned frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./travel-platform-web
          load: true
          push: false
          provenance: false
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Push versioned images to GHCR
        shell: bash
        run: |
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}" | tee artifacts/backend-image-push.log
          docker push "${BACKEND_IMAGE}:${RELEASE_TAG}" | tee -a artifacts/backend-image-push.log
          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}" | tee artifacts/frontend-image-push.log
          docker push "${FRONTEND_IMAGE}:${RELEASE_TAG}" | tee -a artifacts/frontend-image-push.log
          docker image inspect "${BACKEND_IMAGE}:${IMAGE_TAG}" "${FRONTEND_IMAGE}:${IMAGE_TAG}" \
            --format '{{.RepoTags}} {{.Id}}' | tee artifacts/image-versions.log

      - name: Install Kind v0.32.0
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x kind
          sudo install kind /usr/local/bin/kind
          kind version | tee artifacts/kind-version.log
          kubectl version --client | tee artifacts/kubectl-version.log

      - name: Create Kind cluster
        run: >-
          kind create cluster
          --name "${KIND_CLUSTER_NAME}"
          --config deploy/kind/cluster.yaml
          --wait 180s

      - name: Load application images into Kind
        shell: bash
        run: |
          docker pull "${MYSQL_SOURCE_IMAGE}"
          docker tag "${MYSQL_SOURCE_IMAGE}" "${MYSQL_KIND_IMAGE}"
          kind load docker-image "${MYSQL_KIND_IMAGE}" --name "${KIND_CLUSTER_NAME}"
          kind load docker-image "${BACKEND_IMAGE}:${IMAGE_TAG}" --name "${KIND_CLUSTER_NAME}"
          kind load docker-image "${FRONTEND_IMAGE}:${IMAGE_TAG}" --name "${KIND_CLUSTER_NAME}"

      - name: 7. Deploy to Kubernetes
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.CI_DB_PASSWORD }}
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
        run: bash scripts/deploy-kind.sh | tee artifacts/kubernetes-deploy.log

      - name: 8. Run Kubernetes health checks
        run: bash scripts/health-check.sh | tee artifacts/kubernetes-health-check.log

      - name: Collect Docker and Kubernetes diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-containers.txt 2>&1 || true
          mysql_container="$(docker ps -aq --filter ancestor=mysql:8.4 | head -n 1)"
          if [[ -n "$mysql_container" ]]; then
            docker logs "$mysql_container" > artifacts/ci-mysql.log 2>&1 || true
          fi
          bash scripts/collect-k8s-logs.sh artifacts/k8s || true

      - name: Save workflow result
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "result=${{ job.status }}"
            echo "backend_image=${BACKEND_IMAGE:-not-built}:${IMAGE_TAG:-not-built}"
            echo "frontend_image=${FRONTEND_IMAGE:-not-built}:${IMAGE_TAG:-not-built}"
          } > artifacts/run-summary.txt

      - name: Retain success or failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-cd-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            artifacts/**
            travel-platform-server/target/surefire-reports/**
            travel-platform-server/target/site/jacoco/**
